min_version = "2026.11.12"

[settings]
experimental = true
minimum_release_age = "1h"

[settings.aqua]
github_attestations = false

[bootstrap.packages]
"apk:curl" = "latest"
"apk:git" = "latest"
"apk:tmux" = "latest"
"apk:zsh" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"
"dnf:curl" = "latest"
"dnf:git" = "latest"
"dnf:tmux" = "latest"
"dnf:zsh" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:tmux" = "latest"
"pacman:zsh" = "latest"

[bootstrap.repos]
"~/.config/delta/catppuccin" = { url = "https://github.com/catppuccin/delta.git", ref = "main" }
"~/.zsh/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "master" }
"~/.zsh/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "master" }

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[tasks.bootstrap]
description = "Configure user-level settings not covered by declarative bootstrap sections"
run = [
  "git config --global user.name Rajesh",
  "git config --global user.email hyperoot.tech@proton.me",
]

[tools]
atuin = "latest"
bat = "latest"
bottom = "latest"
codex = "latest"
delta = "latest"
dive = "latest"
dust = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
flux2 = "latest"
fzf = "latest"
github-cli = "latest"
"github:iximiuz/labctl" = "latest"
go = "latest"
herdr = "latest"
jq = "latest"
jqp = "latest"
k9s = "latest"
kubectl = "latest"
lua = "latest"
lua-language-server = "latest"
neovim = "latest"
node = "lts"
pi = "latest"
pnpm = "latest"
ripgrep = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
uv = "latest"
yazi = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
zoxide = "latest"

# config/ mirrors the destination home directory.
[settings.dotfiles]
root = "{{ config_root }}/../config"

[dotfile_groups.home]
root = "."
mode = "copy"
exclude = ["/.config/hypr", "/.config/omarchy"]

[dotfile_groups.home.entries]
"~/.zshrc" = { mode = "copy" }
"~/.tmux.conf" = { mode = "copy" }
"~/.config/zsh" = { mode = "copy" }
"~/.config/starship.toml" = { mode = "copy" }
"~/.config/atuin/config.toml" = { mode = "copy", permissions = "0600" }
"~/.config/atuin/themes/catppuccin-mocha-mauve.toml" = { mode = "copy", permissions = "0600" }
"~/.config/zed/keymap.json" = { mode = "copy" }
"~/.config/zed/settings.json" = { mode = "copy", permissions = "0600" }

# The setup script selects this environment on an Omarchy workstation.
"~/.config/hypr/bindings.lua" = { mode = "copy", variants = [{ profile = "omarchy" }] }
"~/.config/omarchy/shell.json" = { mode = "copy", permissions = "0600", variants = [{ profile = "omarchy" }] }
