min_version = "2026.11.12"

[settings]
experimental = true

[settings.aqua]
github_attestations = false

[bootstrap.packages]
"apk:curl" = "latest"
"apk:git" = "latest"
"apk:tmux" = "latest"
"apk:zsh" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:python3" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"
"dnf:curl" = "latest"
"dnf:git" = "latest"
"dnf:tmux" = "latest"
"dnf:zsh" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:tmux" = "latest"
"pacman:zsh" = "latest"

[bootstrap.repos]
"~/.zsh/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "master" }
"~/.zsh/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "master" }

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[tasks.bootstrap]
description = "Configure user-level settings not covered by declarative bootstrap sections"
run = [
  "git config --global user.name Rajesh",
  "git config --global user.email hyperoot.tech@proton.me",
]

[tools]
bat = "latest"
bottom = "latest"
dust = "latest"
eza = "latest"
fzf = "latest"
jq = "latest"
jqp = "latest"
ripgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
zoxide = "latest"

# config/ mirrors the destination home directory.
[vars]
dotfiles_checkout = "{{ config_root | dirname }}/config"
dotfiles_profile = "{{ config_source }}"

[settings.dotfiles]
root = "{{ config_root }}/../config"

[dotfile_groups.home]
root = "."
mode = "copy"
exclude = ["/.config/hypr", "/.config/omarchy"]

[dotfile_groups.home.entries]
"~/.config/mise/conf.d/dotfiles.toml" = { source = ".config/mise/conf.d/dotfiles.toml.tera", mode = "template" }
"~/.zshrc" = { mode = "copy" }
"~/.tmux.conf" = { mode = "copy" }
"~/.config/zsh" = { mode = "copy" }
"~/.config/starship.toml" = { mode = "copy" }
"~/.config/atuin/config.toml" = { mode = "copy", permissions = "0600" }
"~/.config/atuin/themes/catppuccin-mocha-mauve.toml" = { mode = "copy", permissions = "0600" }
"~/.config/zed/keymap.json" = { mode = "copy" }
"~/.config/zed/settings.json" = { mode = "copy", permissions = "0600" }
