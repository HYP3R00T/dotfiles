[tools]
node = "lts"
prek = "latest"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"

[settings]
experimental = true

[settings.aqua]
github_attestations = false

[env]
_.file = '.env'       # for sensitive data
UV_LINK_MODE = "copy"

[hooks]
enter = "bash ./scripts/enter_project.sh"

[tasks.docs]
run = "zensical serve"
description = "Serve the documentation locally"
