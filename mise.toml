[tools]
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
shfmt = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true

[settings.github]
use_git_credentials = true

[env]
_.file = ".env"  # for sensitive data

[hooks]
enter = "bash ./scripts/enter_project.sh"

[tasks.docs]
run = "uvx zensical serve"
description = "Serve the documentation locally"
