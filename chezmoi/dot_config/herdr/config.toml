onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "reset"

[keys]
prefix = "ctrl+space"
reload_config = "prefix+r"
goto = "prefix+space"
previous_workspace = ["prefix+shift+k", "alt+shift+up"]
next_workspace = ["prefix+shift+j", "alt+shift+down"]
previous_tab = ["prefix+shift+h", "alt+shift+left"]
next_tab = ["prefix+shift+l", "alt+shift+right"]
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]
split_vertical = "prefix+|"
resize_mode = "prefix+shift+r"

[[keys.command]]
# https://github.com/cloudmanic/herdr-plus
# `herdr plugin install cloudmanic/herdr-plus`
key = "prefix+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[experimental]
kitty_graphics = true
pane_history = false

[ui]
agent_panel_sort = "spaces"
confirm_close = false
hide_tab_bar_when_single_tab = false
pane_borders = true
pane_gaps = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
sidebar_collapsed_mode = "compact"
sidebar_max_width = 20
sidebar_min_width = 16
sidebar_start_collapsed = true
sidebar_width = 18
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "agent", "workspace", "tab"]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", "branch", "git_status"]]

[ui.toast]
delivery = "herdr"
