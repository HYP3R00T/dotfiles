Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = "󰍲 "

[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "208"

[python]
symbol = " "
format = '[$symbol$pyenv_prefix$version]($style)( [󰆧 $virtualenv](green)) '
style = "yellow"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "red"

[shell]
bash_indicator = " "
fish_indicator = '󰈺 '
powershell_indicator = '_'
unknown_indicator = ''
disabled = true

[sudo]
symbol = "󰢏 "
disabled = false
format = "[$symbol]($style)"
style = "red"

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "

[username]
disabled = true

