# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Keep consecutive prompts compact.
add_newline = false

# Use the Catppuccin Mocha color palette
palette = 'catppuccin_mocha'

# Smart-minimal layout: project context left, operational context right.
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$package\
$fill\
$cmd_duration\
$kubernetes\
$line_break\
$character"""


[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'

[cmd_duration]
min_time = 2_000
format = '[󰔛 $duration]($style) '
style = 'overlay1'

[container]
format = '[$symbol $name]($style) '
style = 'blue'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
read_only = ' 󰌾'
style = 'lavender'
truncation_length = 3
truncate_to_repo = true

[fill]
disabled = false
symbol = " "
style = "surface0"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = 'mauve'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "peach"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰏗 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[hostname]
ssh_only = true
ssh_symbol = ''
format = '[$ssh_symbol](blue) [$hostname](green) '
disabled = false

[jobs]
style = 'blue'

[kubernetes]
format = '[$symbol$context(::$namespace)]($style) '
symbol = "󱃾 "
disabled = false
style = 'blue'

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "green"

[os]
disabled = true
style = 'fg:red'

[os.symbols]
Alpaquita = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
